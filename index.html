<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Flores para ti, Te amo</title>

        <!-- Fuente bonita para el título (Google Fonts) -->
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&display=swap" rel="stylesheet">

        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <!-- El lienzo donde se dibuja todo -->
        <canvas id="lienzo"></canvas>

        <!-- El mensaje que aparece cuando el ramo termina de abrirse -->
        <h1 id="titulo">Para ti, te amo <span class="latido">❤️</span></h1>

        <!-- La portada con el botón -->
        <div id="portada">
            <p>Tengo algo para ti...</p>
            <button id="boton">Ábreme 💌</button>
        </div>

        <script src="script.js"></script>
    </body>
</html>
